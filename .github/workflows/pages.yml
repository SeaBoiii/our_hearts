name: Validate and deploy our hearts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: our-hearts-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Derive deployment base
        env:
          CONFIGURED_BASE: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE" ]; then
            printf 'VITE_BASE_PATH=%s\n' "$CONFIGURED_BASE" >> "$GITHUB_ENV"
          else
            printf 'VITE_BASE_PATH=/%s/\n' "${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Validate root deployment
        id: validate_root
        run: npm run build && npm run test:browser
        env:
          VITE_BASE_PATH: /
      - name: Upload root browser failure diagnostics
        if: failure() && steps.validate_root.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-root-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Build project deployment
        run: npm run build
      - name: Validate project deployment
        id: validate_project
        run: npm run test:browser
      - name: Upload project browser failure diagnostics
        if: failure() && steps.validate_project.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-project-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
